<!DOCTYPE html>
<html lang="en">
	<head>
		<title>TI4 Viewer</title>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
		/>
	</head>
	<body>
		<script type="module" src="src/main.mts"></script>
		<div id="info">
			Images and metadata from <a href="https://asyncti4.github.io">Async TI4 project</a><br/>
			Models: <span id="modelDesc"></span>.<br/>
			Hosted on Github Pages. Work in Progress.
		</div>
		<div id="sidebar">
			<div id="unit">
				Selected unit: <span id="name">None</span><br/>
				Color: <span id="color">None</span><br/>
			</div>
			<div id="system">
				Selected system: <span id="name">None</span><br/>
				Location: <span id="location">None</span><br/>
				Debug: <canvas id="debug" width="240" height="240"></canvas>
			</div>
		</div>
	</body>
</html>
